<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hearth · Sign in with Home Assistant</title>
  <meta name="description" content="Hearth signs in to your own Home Assistant. This page identifies the app to Home Assistant." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f1ebe1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#19180f" media="(prefers-color-scheme: dark)" />
  <!-- Home Assistant (IndieAuth) reads this to allow the app's sign-in callback. -->
  <link rel="redirect_uri" href="homenative://auth-callback" />
  <link rel="icon" type="image/png" href="../assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .auth { max-width: 560px; margin: 0 auto; padding: clamp(64px, 12vw, 140px) 0; text-align: center; }
    .auth img { width: 88px; height: 88px; border-radius: 22px; margin-bottom: 24px; }
    .auth h1 { font-size: clamp(2.2rem, 5vw, 3rem); margin-bottom: 14px; }
    .auth p { color: var(--ink-soft); margin-bottom: 12px; }
    .auth a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="auth h-app">
      <img class="u-logo" src="../assets/icon.png" alt="" />
      <h1 class="p-name">Hearth</h1>
      <p>Hearth signs in to your own Home Assistant. Your credentials stay between the app and your Home Assistant; nothing passes through this site.</p>
      <p>This page only tells Home Assistant where to send you back after signing in. There's nothing to do here.</p>
      <p><a class="u-url" href="https://wallpad.app/">wallpad.app</a></p>
    </section>
  </main>
</body>
</html>
